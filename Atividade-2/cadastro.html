    <link rel="stylesheet" href="css/pages.css">

<body>

<header class="container">
    <img src="imagens/logo.webp" alt="Logo da ONG Meu Aumigo" width="150">
</header>

<nav class="container">
    <span id="menu-btn">☰</span>
    <ul id="menu-list">

<main class="container">
    <h1>Cadastro</h1>
    <p>Para participar deste projeto, preencha seus dados no formulário abaixo. Entraremos em contato em breve.</p>

    <form>
        <fieldset>
            <legend>Informações Pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento">

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco">

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade">

            <label for="estado">Estado:</label>
            <input type="text" id="estado">
        </fieldset>

        <input type="submit" value="Enviar Cadastro">
    </form>
</main>

<br>
